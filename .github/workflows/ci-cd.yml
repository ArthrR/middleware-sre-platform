name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Stage 1: Lint & Validate ───────────────────────────────────────
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        # kubeconform (kubeval's maintained successor) validates offline against
        # upstream OpenAPI schemas — no live cluster needed. Replaced azure/k8s-lint@v1,
        # which pulls in a deprecated Node runtime and was failing CI outright.
        run: |
          docker run --rm -v "${{ github.workspace }}/kubernetes:/data" \
            ghcr.io/yannh/kubeconform:latest \
            -summary -strict \
            /data/namespace.yaml \
            /data/nginx.yaml \
            /data/nodejs.yaml \
            /data/postgres.yaml \
            /data/redis.yaml \
            /data/tomcat.yaml \
            /data/monitoring.yaml \
            /data/ingress.yaml \
            /data/ai-gateway.yaml \
            /data/qdrant.yaml

      - name: Lint Docker Compose (core + ai profile)
        run: |
          cd docker-compose
          docker compose --profile ai config --quiet
          echo "✅ Docker Compose config is valid"

      - name: Validate Prometheus config
        run: |
          set -e
          docker run -d --name prom-validate \
            -v ${{ github.workspace }}/docker-compose/prometheus:/etc/prometheus \
            prom/prometheus:latest \
            --config.file=/etc/prometheus/prometheus.yml \
            --web.listen-address=":9999"
          sleep 3
          RUNNING=$(docker inspect -f '{{.State.Running}}' prom-validate)
          docker logs prom-validate
          docker rm -f prom-validate >/dev/null
          if [ "$RUNNING" != "true" ]; then
            echo "❌ Prometheus config is invalid"
            exit 1
          fi
          echo "✅ Prometheus config is valid"

  # ─── Stage 2: Build Docker Images ───────────────────────────────────
  build:
    name: Build & Push (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: nodejs-app
            context: docker-compose/apps/nodejs
          - name: ai-gateway
            context: docker-compose/apps/ai-gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Required for cache-to/cache-from: type=gha below — the default "docker"
      # buildx driver doesn't support GHA cache export, only "docker-container" does.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ─── Stage 3: Deploy to Kubernetes ──────────────────────────────────
  # Deploys the `:latest` tag published above; the sha-tagged image stays in
  # GHCR for traceability/rollback-by-digest. `kubectl rollout undo` below
  # handles rollback via Kubernetes' own revision history, not tag pinning.
  deploy:
    name: Deploy to Cluster (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    strategy:
      matrix:
        include:
          - name: nodejs-app
            deployment: nodejs-api
            container: nodejs
          - name: ai-gateway
            deployment: ai-gateway
            container: ai-gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply namespace and configs
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          echo "✅ Namespace applied"

      - name: Resolve lowercase image path
        id: image
        run: echo "name_lower=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Update image tag in deployment
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ steps.image.outputs.name_lower }}/${{ matrix.name }}:latest"
          kubectl set image "deployment/${{ matrix.deployment }}" \
            "${{ matrix.container }}=${IMAGE_TAG}" \
            -n enterprise-middleware \
            --record
          echo "🚀 Deploying image: ${IMAGE_TAG}"

      - name: Apply remaining manifests
        run: |
          kubectl apply -f kubernetes/ -n enterprise-middleware
          echo "✅ All manifests applied"

      - name: Wait for rollout
        id: rollout
        run: |
          echo "⏳ Waiting for rollout to complete..."
          if kubectl rollout status deployment/${{ matrix.deployment }} \
              -n enterprise-middleware \
              --timeout=180s; then
            echo "✅ Rollout successful"
            echo "rollout_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Rollout failed — triggering rollback"
            echo "rollout_status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Rollback on failure
        if: failure() && steps.rollout.outputs.rollout_status == 'failed'
        run: |
          echo "🔄 Rolling back deployment..."
          kubectl rollout undo deployment/${{ matrix.deployment }} -n enterprise-middleware
          kubectl rollout status deployment/${{ matrix.deployment }} \
            -n enterprise-middleware \
            --timeout=120s
          echo "✅ Rollback completed"

  # ─── Stage 4: Post-Deploy Health Check ──────────────────────────────
  healthcheck:
    name: Post-Deploy Health Check (${{ matrix.deployment }})
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        deployment: [nodejs-api, ai-gateway]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Run health checks
        run: |
          chmod +x scripts/bash/healthcheck-deploy.sh
          bash scripts/bash/healthcheck-deploy.sh enterprise-middleware ${{ matrix.deployment }}

      - name: Verify SLO — pod availability
        run: |
          READY=$(kubectl get deployment ${{ matrix.deployment }} \
            -n enterprise-middleware \
            -o jsonpath='{.status.readyReplicas}')
          DESIRED=$(kubectl get deployment ${{ matrix.deployment }} \
            -n enterprise-middleware \
            -o jsonpath='{.spec.replicas}')

          if [ "$READY" -eq "$DESIRED" ]; then
            echo "✅ SLO check passed: $READY/$DESIRED pods ready"
          else
            echo "❌ SLO check failed: only $READY/$DESIRED pods ready"
            exit 1
          fi

      - name: Notify deploy success
        if: success()
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "   Deployment: ${{ matrix.deployment }}"
          echo "   Commit: ${{ github.sha }}"
          echo "   Author: ${{ github.actor }}"
          echo "   Branch: ${{ github.ref_name }}"

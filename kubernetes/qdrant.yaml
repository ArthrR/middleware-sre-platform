apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: enterprise-middleware
  labels:
    app: qdrant
    tier: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
      tier: ai
  template:
    metadata:
      labels:
        app: qdrant
        tier: ai
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        ports:
        - containerPort: 6333
          name: http
        - containerPort: 6334
          name: grpc
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: qdrant-storage
          mountPath: /qdrant/storage
        livenessProbe:
          tcpSocket:
            port: 6333
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6333
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: qdrant-storage
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
  namespace: enterprise-middleware
  labels:
    app: qdrant
spec:
  type: ClusterIP
  selector:
    app: qdrant
    tier: ai
  ports:
  - name: http
    port: 6333
    targetPort: 6333
    protocol: TCP
  - name: grpc
    port: 6334
    targetPort: 6334
    protocol: TCP

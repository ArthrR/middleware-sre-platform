# NOTE: Ollama and MLflow are intentionally NOT deployed to Kubernetes in this
# lab — they're heavier/stateful services better suited to docker-compose on
# a laptop. In production this gateway would call a KServe/vLLM Deployment or
# a managed inference endpoint instead of OLLAMA_BASE_URL below. See
# docs/ARCHITECTURE.md for the full rationale. OLLAMA_BASE_URL defaults to
# host.docker.internal, which reaches an Ollama started via
# `docker compose --profile ai up -d ollama` on Docker Desktop Kubernetes;
# adjust for Minikube/Kind.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway-config
  namespace: enterprise-middleware
  labels:
    app: ai-gateway
data:
  OLLAMA_BASE_URL: "http://host.docker.internal:11434"
  OLLAMA_MODEL: "llama3.2:1b"
  OLLAMA_EMBED_MODEL: "nomic-embed-text"
  QDRANT_URL: "http://qdrant-service:6333"
  QDRANT_COLLECTION: "lab-docs"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: enterprise-middleware
  labels:
    app: ai-gateway
    tier: ai
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-gateway
      tier: ai
  template:
    metadata:
      labels:
        app: ai-gateway
        tier: ai
    spec:
      containers:
      - name: ai-gateway
        image: ghcr.io/arthrr/ai-platform-lab/ai-gateway:latest
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: ai-gateway-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway-service
  namespace: enterprise-middleware
  labels:
    app: ai-gateway
spec:
  type: ClusterIP
  selector:
    app: ai-gateway
    tier: ai
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-gateway-hpa
  namespace: enterprise-middleware
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
